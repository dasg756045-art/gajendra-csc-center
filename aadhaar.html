<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aadhaar Services</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f2f2f2;
}

.service-page{
padding:60px 20px;
max-width:1100px;
margin:auto;
}

.service-box{
background:#fff;
padding:40px;
border-radius:28px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.service-title{
background:#0b4bff;
color:#fff;
padding:24px;
text-align:center;
font-size:42px;
font-weight:800;
margin-bottom:40px;
border-radius:18px;
}

.service-list{
display:flex;
flex-direction:column;
gap:18px;
}

.service-item{
background:#eef2ff;
padding:22px;
border-left:6px solid #0b4bff;
border-radius:12px;
font-size:22px;
font-weight:600;
}

.back-btn{
display:inline-block;
margin-top:40px;
background:#0b4bff;
color:#fff;
padding:16px 28px;
border-radius:12px;
text-decoration:none;
font-weight:700;
}

@media(max-width:768px){

.service-title{
font-size:28px;
padding:18px;
}

.service-item{
font-size:17px;
padding:18px;
}

.service-box{
padding:20px;
}

}

</style>

</head>

<body>

<div class="service-page">

<div class="service-title">
Aadhaar Services
</div>

<div class="service-box">

<h2 style="margin-bottom:30px;color:#0b4bff;">
Available Services
</h2>

<div class="service-list">

<div class="service-item">
Aadhaar New Apply
</div>

<div class="service-item">
Aadhaar Mobile Update
</div>

<div class="service-item">
Aadhaar Address Update
</div>

<div class="service-item">
Aadhaar DOB Correction
</div>

<div class="service-item">
PVC Aadhaar Card Apply
</div>

<div class="service-item">
Aadhaar Download
</div>

</div>

<a href="index.html" class="back-btn">
← Back To Home
</a>

</div>

</div>

</body>
</html>
